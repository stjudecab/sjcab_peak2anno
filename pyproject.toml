[build-system]
requires = ["setuptools>=61", "versioningit", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sjcab_peak2anno"
dynamic = ["version"]
description = "Annotate genomic peaks to genes, genomic features, and chromatin states."
readme = "README.md"
requires-python = ">=3.7"
dependencies = [
    "sjcab_peak2anno_db",
]
authors = [
  {name = "St. Jude CAB"}
]
keywords = ["bioinformatics", "genomics", "BED", "peak annotation"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.7",
  "Programming Language :: Python :: 3.8",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Programming Language :: Python :: 3 :: Only",
  "Topic :: Scientific/Engineering :: Bio-Informatics",
]

[project.urls]
Homepage = "https://github.com/stjudecab/sjcab_peak2anno"
Repository = "https://github.com/stjudecab/sjcab_peak2anno"
Issues = "https://github.com/stjudecab/sjcab_peak2anno/issues"
Doc = "https://sjcab-peak2anno.readthedocs.io"

[project.scripts]
peak2anno = "sjcab_peak2anno.cli:main"
sjcab-peak2anno = "sjcab_peak2anno.cli:main"
sjcab_peak2anno = "sjcab_peak2anno.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.versioningit]
default-version = "0.0.0"

[tool.versioningit.format]
# Keep the latest tag when only uncommitted working-tree changes are present.
distance = "{base_version}"
dirty = "{base_version}"
distance-dirty = "{base_version}"

[tool.versioningit.write]
file = "src/sjcab_peak2anno/_version.py"

[project.optional-dependencies]
plot = ["matplotlib>=3.5"]
test = ["pytest>=7"]



[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
