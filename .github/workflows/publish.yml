name: Publish package

on:
  push:
    tags:
      - "*"
  workflow_dispatch:
    inputs:
      ref:
        description: "Branch or tag to publish"
        required: true
        default: "master"
        type: string

permissions:
  contents: read

jobs:
  pypi:
    name: Publish to PyPI
    runs-on: ubuntu-latest
    environment: pypi
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Build distributions
        run: |
          python -m pip install --upgrade build twine
          python -m build
          python -m twine check dist/*
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1

  conda:
    name: Publish to conda
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}
      - uses: conda-incubator/setup-miniconda@v3
        with:
          activate-environment: publish
          python-version: "3.11"
          channels: conda-forge
          channel-priority: strict
          miniforge-version: latest
      - name: Build conda package
        shell: bash -el {0}
        run: |
          conda install --yes conda-build anaconda-client
          conda-build conda-recipe \
            --output-folder conda-bld \
            --channel stjudecab \
            --channel conda-forge
      - name: Upload to the stjudecab channel
        shell: bash -el {0}
        env:
          ANACONDA_API_TOKEN: ${{ secrets.ANACONDA_API_TOKEN }}
        run: |
          mapfile -d '' packages < <(find conda-bld -type f \( -name '*.tar.bz2' -o -name '*.conda' \) -print0)
          if [ "${#packages[@]}" -eq 0 ]; then
            echo "No conda packages were built" >&2
            exit 1
          fi
          anaconda upload --force --user stjudecab --label main "${packages[@]}"
