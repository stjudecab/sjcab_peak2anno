name: Publish package

on:
  push:
    tags:
      - "*"
  workflow_dispatch:
    inputs:
      ref:
        description: "Branch or tag to publish"
        required: true
        default: "master"
        type: string

jobs:
  pypi:
    name: Publish to PyPI
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Build distributions
        run: |
          python -m pip install --upgrade build
          python -m build

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1

  conda:
    name: Publish to Anaconda
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}

      - name: Set up Conda
        uses: conda-incubator/setup-miniconda@v3
        with:
          auto-update-conda: true
          activate-environment: publish
          python-version: "3.11"
          channels: "bioconda,conda-forge"
          channel-priority: strict

      - name: Build Conda package
        shell: bash -el {0}
        run: |
          conda install --yes --override-channels -c conda-forge -c bioconda conda-build anaconda-client
          conda-build "${GITHUB_WORKSPACE}/conda-recipe" \
            --output-folder conda-channel \
            --channel stjudecab \
            --channel bioconda \
            --channel conda-forge
      - name: Upload to the stjudecab channel
        shell: bash -el {0}
        env:
          ANACONDA_API_TOKEN: ${{ secrets.ANACONDA_API_TOKEN }}
        run: |
          test -n "${ANACONDA_API_TOKEN}"
          shopt -s globstar nullglob
          packages=(conda-channel/**/*.tar.bz2 conda-channel/**/*.conda)
          if [ "${#packages[@]}" -eq 0 ]; then
            echo "No conda packages were built" >&2
            exit 1
          fi
          anaconda upload --force --user stjudecab --label main "${packages[@]}"
