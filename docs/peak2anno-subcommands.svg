<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1280" viewBox="0 0 1200 1280">
  <defs>
    <style>
      .title { font: 700 28px sans-serif; fill: #12345a }
      .panel-title { font: 700 25px sans-serif; fill: white }
      .body { font: 600 17px sans-serif; fill: #12345a }
      .small { font: 600 14px sans-serif; fill: #12345a }
      .tiny { font: 600 12px sans-serif; fill: #12345a }
      .panel { stroke-width: 3; rx: 18 }
      .track { stroke: #7b8794; stroke-width: 8; stroke-linecap: round }
      .peak { fill: #ef4a43; stroke: #b52e2a; stroke-width: 2 }
    </style>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#155486"/>
    </marker>
  </defs>
  <rect width="1200" height="1280" fill="#fff"/>

  <rect x="405" y="18" width="390" height="180" rx="20" fill="#e7f4ff" stroke="#2388c8" stroke-width="4"/>
  <text x="600" y="52" text-anchor="middle" class="title">Input: a BED peak</text>
  <text x="480" y="82" class="body">chr</text><text x="590" y="82" class="body">start</text><text x="700" y="82" class="body">end</text>
  <text x="480" y="108" class="body">chr1</text><text x="590" y="108" class="body">100,000</text><text x="700" y="108" class="body">101,000</text>
  <line x1="455" y1="150" x2="745" y2="150" class="track"/>
  <path d="M570 150 C585 150 592 105 600 105 C608 105 615 150 630 150 Z" class="peak"/>
  <text x="600" y="180" text-anchor="middle" class="small">chr1:100,000-101,000</text>

  <path d="M600 198 V232 M600 232 H150 V270 M600 232 H1050 V270 M600 232 H450 V270 M600 232 H750 V270" fill="none" stroke="#155486" stroke-width="8" marker-end="url(#arrow)"/>

  <rect x="15" y="270" width="275" height="425" class="panel" fill="#edf8ff" stroke="#28a5e8"/>
  <rect x="15" y="270" width="275" height="60" rx="18" fill="#238fd0"/>
  <text x="152" y="308" text-anchor="middle" class="panel-title">peak2gene</text>
  <text x="152" y="360" text-anchor="middle" class="body">Nearest genes and</text><text x="152" y="384" text-anchor="middle" class="body">promoter/enhancer</text>
  <line x1="40" y1="490" x2="265" y2="490" class="track"/>
  <path d="M95 490 C105 490 110 435 120 435 C130 435 135 490 145 490 Z" class="peak"/>
  <path d="M55 540 H130 L140 550 L130 560 H55 Z" fill="#378edb"/><text x="92" y="582" text-anchor="middle" class="small">Gene A</text>
  <path d="M170 540 H245 V560 H170 L160 550 Z" fill="#49a85b"/><text x="207" y="582" text-anchor="middle" class="small">Gene B</text>
  <rect x="30" y="615" width="245" height="62" rx="12" fill="#d9efff"/><text x="152" y="641" text-anchor="middle" class="small">Output: nearby genes and</text><text x="152" y="660" text-anchor="middle" class="small">promoter/enhancer relations</text>

  <rect x="310" y="270" width="275" height="425" class="panel" fill="#efffff" stroke="#18aaa9"/>
  <rect x="310" y="270" width="275" height="60" rx="18" fill="#159c9c"/>
  <text x="447" y="308" text-anchor="middle" class="panel-title">narrow2feature</text>
  <text x="447" y="360" text-anchor="middle" class="body">One priority</text><text x="447" y="384" text-anchor="middle" class="body">feature label</text>
  <line x1="335" y1="490" x2="560" y2="490" class="track"/>
  <rect x="355" y="515" width="85" height="22" rx="4" fill="#f2b62a"/><text x="397" y="557" text-anchor="middle" class="small">Promoter</text>
  <rect x="440" y="515" width="95" height="22" rx="4" fill="#53b768"/><text x="487" y="557" text-anchor="middle" class="small">Intron</text>
  <path d="M390 490 C402 490 410 438 422 438 C434 438 442 490 454 490 Z" class="peak"/>
  <line x1="440" y1="505" x2="440" y2="570" stroke="#12345a" stroke-dasharray="5 4"/>
  <path d="M447 570 V585" stroke="#155486" stroke-width="4" marker-end="url(#arrow)"/>
  <rect x="382" y="600" width="130" height="38" rx="10" fill="#fff1c8" stroke="#ef9f00" stroke-width="2"/><text x="447" y="625" text-anchor="middle" class="body">Promoter</text>
  <text x="447" y="665" text-anchor="middle" class="tiny">Peak overlaps promoter + intron;</text>

  <rect x="605" y="270" width="275" height="425" class="panel" fill="#fff5ed" stroke="#ec741e"/>
  <rect x="605" y="270" width="275" height="60" rx="18" fill="#eb5b13"/>
  <text x="742" y="308" text-anchor="middle" class="panel-title">broad2feature</text>
  <text x="742" y="360" text-anchor="middle" class="body">Overlap percentages</text><text x="742" y="384" text-anchor="middle" class="body">across features</text>
  <line x1="630" y1="490" x2="855" y2="490" class="track"/>
  <path d="M687 490 C700 490 708 438 720 438 C732 438 740 490 753 490 Z" class="peak"/>
  <rect x="635" y="515" width="46" height="22" fill="#f2b62a"/><rect x="688" y="515" width="86" height="22" fill="#4ca8e8"/><rect x="781" y="515" width="48" height="22" fill="#53b768"/><rect x="836" y="515" width="19" height="22" fill="#9b78c8"/>
  <text x="658" y="557" text-anchor="middle" class="tiny">Promoter</text><text x="731" y="557" text-anchor="middle" class="tiny">Exon</text><text x="805" y="557" text-anchor="middle" class="tiny">Intron</text><text x="845" y="557" text-anchor="middle" class="tiny">Intergenic</text>
  <text x="658" y="580" text-anchor="middle" class="small">10%</text><text x="731" y="580" text-anchor="middle" class="small">50%</text><text x="805" y="580" text-anchor="middle" class="small">25%</text><text x="845" y="580" text-anchor="middle" class="small">15%</text>
  <rect x="665" y="610" width="155" height="38" rx="10" fill="#d7edff" stroke="#2388c8" stroke-width="2"/><text x="742" y="635" text-anchor="middle" class="body">Output: Exon (50%)</text>

  <rect x="900" y="270" width="285" height="425" class="panel" fill="#fff9e8" stroke="#f3a500"/>
  <rect x="900" y="270" width="285" height="60" rx="18" fill="#f39a00"/>
  <text x="1042" y="308" text-anchor="middle" class="panel-title">peak2state</text>
  <text x="1042" y="360" text-anchor="middle" class="body">Chromatin-state overlap</text><text x="1042" y="384" text-anchor="middle" class="body">with percentages</text>
  <line x1="925" y1="490" x2="1160" y2="490" class="track"/>
  <path d="M1000 490 C1012 490 1020 438 1032 438 C1044 438 1052 490 1064 490 Z" class="peak"/>
  <text x="950" y="535" class="tiny">Active promoter 20%</text><text x="950" y="560" class="tiny">Enhancer 55%</text><text x="950" y="585" class="tiny">Transcribed 15%</text><text x="950" y="610" class="tiny">Repressed 10%</text>
  <rect x="997" y="630" width="120" height="38" rx="10" fill="#fff1b5" stroke="#d59a00" stroke-width="2"/><text x="1057" y="655" text-anchor="middle" class="body">Enhancer</text>

  <rect x="15" y="745" width="1170" height="500" rx="20" fill="#f8fcff" stroke="#238fd0" stroke-width="3"/>
  <rect x="15" y="745" width="1170" height="62" rx="18" fill="#238fd0"/>
  <text x="600" y="785" text-anchor="middle" class="panel-title">loop2gene / loop2feature / loop2state</text>
  <text x="600" y="835" text-anchor="middle" class="title">Annotate both anchors of a BEDPE loop</text>
  <line x1="70" y1="1000" x2="590" y2="1000" class="track"/>
  <path d="M160 1000 C175 1000 180 950 195 950 C210 950 215 1000 230 1000 Z" class="peak"/>
  <path d="M430 1000 C445 1000 450 950 465 950 C480 950 485 1000 500 1000 Z" class="peak"/>
  <path d="M195 945 C250 850 405 850 465 945" fill="none" stroke="#238fd0" stroke-width="4"/>
  <text x="195" y="1030" text-anchor="middle" class="body">Anchor 1</text><text x="465" y="1030" text-anchor="middle" class="body">Anchor 2</text>
  <rect x="650" y="870" width="220" height="135" rx="15" fill="#e7f4ff" stroke="#238fd0" stroke-width="2"/><rect x="890" y="870" width="220" height="135" rx="15" fill="#e7ffff" stroke="#159c9c" stroke-width="2"/>
  <text x="760" y="898" text-anchor="middle" class="body">Anchor 1</text><text x="1000" y="898" text-anchor="middle" class="body">Anchor 2</text>
  <text x="670" y="928" class="tiny">Gene: Gene A</text><text x="670" y="950" class="tiny">Feature: Promoter</text><text x="670" y="972" class="tiny">State: Active promoter</text>
  <text x="910" y="928" class="tiny">Gene: Gene C</text><text x="910" y="950" class="tiny">Feature: Enhancer</text><text x="910" y="972" class="tiny">State: Transcribed</text>
  <rect x="180" y="1120" width="840" height="52" rx="15" fill="#d9efff"/><text x="600" y="1152" text-anchor="middle" class="body">Output per loop: annotations for both anchors (gene / feature / state)</text>
</svg>
